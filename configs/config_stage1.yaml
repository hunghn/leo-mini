# Stage 1 — Warmup Visual Projector
# Trainable: projector only | Frozen: LLM + MMoE-Vision
# Data: EAGLE alignment dataset

stage: 1
llm_path: "meta-llama/Meta-Llama-3-8B-Instruct"

eagle_data_path: "data/eagle/blip_laion_cc_sbu_558k.json"
eagle_sft_path:  ""
llava_data_path: ""
image_dir:       "data/eagle/images"
output_dir:      "checkpoints"

# Architecture
n_visual:    64
d_proj_cotr: 256
lora_rank:   16
num_special: 3

# Optimisation — defaults tuned for a single 48 GB GPU (A6000 / A100).
# Override batch/accumulation via configs/models/<model>.yaml if needed.
learning_rate:         1.0e-3
per_device_batch_size: 4        # 16 → 4  (single GPU)
gradient_accumulation: 16       #  4 → 16 (effective batch = 64)
num_epochs:            1
warmup_ratio:          0.03
max_grad_norm:         1.0
weight_decay:          0.0
lr_scheduler_type:     "cosine"
max_length:            2048
dataloader_workers:    4
save_steps:            500
logging_steps:         10
bf16:                  true
optim:                 "adamw_torch"
gradient_checkpointing: false

deepspeed: null
