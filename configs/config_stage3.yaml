# Stage 3 — Token Reduction Fine-tuning (core LEO-MINI contribution)
# Trainable: CoTR + MMoE-LLM (LoRA adapters + routers)
# Frozen:    LLM backbone weights, MMoE-Vision
# Data:      LLaVA-v1.5 665K instruction data
# Loss:      Cross-entropy + L_balance (λ=0.05)

stage: 3
# llm_path: trainer auto-derives this from output_dir/stage2/checkpoint-last
# when a --model_config is supplied.  Set explicitly here only when running
# without a model config (e.g. using NVEagle/Eagle-X4-8B-Plus directly).
llm_path: "NVEagle/Eagle-X4-8B-Plus"
# projector_path: trainer auto-derives from output_dir/stage2/projector_weights.pt
# when a --model_config is supplied.  Set explicitly to override.
projector_path: null

eagle_data_path: ""
eagle_sft_path:  ""
llava_data_path: "data/llava_v1_5/llava_v1_5_mix665k.json"
image_dir:       "data/images"
output_dir:      "checkpoints"

# Architecture — matches paper Table 6 / Section 4.1
n_visual:    64        # N^V: 576 → 64 tokens via CoTR
d_proj_cotr: 256       # common projection dim for CoTR attention
lora_rank:   16        # LoRA rank for all expert adapters
num_special: 3         # E=3 special LoRA experts

# Optimisation — defaults tuned for a single 48 GB GPU.
# Stage 3 freezes LLM + vision experts; only CoTR + MMoE-LLM adapters are
# trained (~100–200 M params), so memory pressure is low.
learning_rate:         2.0e-5
per_device_batch_size: 4        # 8 → 4
gradient_accumulation: 16       # 8 → 16 (effective batch = 64)
num_epochs:            1
warmup_ratio:          0.03
max_grad_norm:         1.0
weight_decay:          0.0
lr_scheduler_type:     "cosine"
max_length:            2048
dataloader_workers:    4
save_steps:            500
logging_steps:         10
bf16:                  true
balance_loss_lambda:   0.05     # λ for L_balance (Eq. balance, paper Section 3.3)
optim:                 "adamw_torch"
gradient_checkpointing: false   # not needed — backbone is frozen

deepspeed: null
