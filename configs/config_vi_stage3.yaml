# Vi-LEO-MINI — Stage 3: Token Reduction (CoTR + MMoE-LLM)
# Trainable: CoTR + MMoE-LLM LoRA experts + Routers + Projector
# Frozen:    LLM backbone, MMoE-Vision
# Data:      ViTextVQA train split
# Loss:      Cross-entropy + L_balance (λ=0.05)
#
# Core contribution: learns to reduce 576 visual tokens → 128 via CoTR
# while routing through specialised LoRA experts in each LLM MLP block.

stage: 3

# llm_path auto-derived from output_dir/stage2/llm_checkpoint/ by trainer.
llm_path: "Qwen/Qwen2.5-3B-Instruct"

eagle_data_path: ""
eagle_sft_path:  ""
llava_data_path: ""
image_dir:       ""
output_dir:      "checkpoints"

pix2struct_model_name: "google/pix2struct-large"

# Architecture
n_visual:    128
d_proj_cotr: 256
lora_rank:   16
num_special: 3

# Optimisation
# Stage 3 trains only adapters — lower LR prevents overwriting Stage 2 alignment.
learning_rate:         2.0e-5
# per_device 8 × accum 8 = effective batch 64 (same as before, better GPU
# utilisation; Stage 3 only needs ~15GB at batch 4 — plenty of headroom).
per_device_batch_size: 8
gradient_accumulation: 8
# num_epochs=3: ViTextVQA train is only 35K samples (~550 steps/epoch at
# effective batch 64) vs the paper's 665K — CoTR + routers + LoRA start from
# random init and need the extra passes. Watch dev ANLS at the mid-train eval
# points; if it plateaus/drops after epoch 2, use the earlier checkpoint.
num_epochs:            3
warmup_ratio:          0.03
max_grad_norm:         1.0
weight_decay:          0.0
lr_scheduler_type:     "cosine"
max_length:            512
dataloader_workers:    12

# OCR-in-prompt: precomputed scene-text map (scripts/precompute_ocr.py).
# Both training and mid-train eval prepend this text to the question.
# MUST exist before training — generate it first:
#   python scripts/precompute_ocr.py --image_dir <st_images dir> --output data/ocr/vitextvqa_ocr.json
vi_ocr_json: "data/ocr/vitextvqa_ocr.json"
save_steps:            200
logging_steps:         10
bf16:                  true
optim:                 "adamw_bnb_8bit"
gradient_checkpointing: false    # CoTR + LoRA are light — not needed

# Mid-training validation: run ANLS/EM/F1 on 50 samples of vi_val_path every
# 200 steps, logged into the same JSON log as train_step (visible live in
# eval_metrics_history.png while training is still running). Without this,
# a multi-hour Stage 3 run gives no signal until it fully finishes.
eval_steps: 200
eval_limit: 50

balance_loss_lambda: 0.05
deepspeed: null
